name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (lint, check, unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: izgah
          POSTGRES_PASSWORD: izgah
          POSTGRES_DB: izgah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U izgah -d izgah_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://izgah:izgah@127.0.0.1:5432/izgah_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  extensions:
    name: Extensions (lint, check, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extensions/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - name: Build and verify the store extension (no host permissions)
        run: pnpm build:store
      - uses: actions/upload-artifact@v4
        # Convenience download only; a full artifact quota must not fail CI.
        continue-on-error: true
        with:
          name: extensions-store-build
          path: |
            extensions/.output/chrome-mv3
            extensions/.output/firefox-mv3
          retention-days: 3

  image:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: izgah:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
