services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-izgah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-izgah}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-izgah} -d ${POSTGRES_DB:-izgah}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: izgah-core:prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bind to loopback only: the app must be reached through the reverse proxy, otherwise clients
      # can forge the rightmost X-Forwarded-For entry and bypass per-IP rate limits.
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-izgah}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-izgah}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-12}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      ORIGIN: ${ORIGIN:?ORIGIN must be set}
      HOST: 0.0.0.0
      PORT: 3000
      ADDRESS_HEADER: ${ADDRESS_HEADER:-x-forwarded-for}
      XFF_DEPTH: ${XFF_DEPTH:-1}
      MEDIA_STORAGE_DIR: /data/thumbnails
      MEDIA_MIN_FREE_BYTES: ${MEDIA_MIN_FREE_BYTES:-536870912}
      MEDIA_MIN_FREE_RATIO: ${MEDIA_MIN_FREE_RATIO:-0.15}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UNFURL_CONCURRENCY: ${UNFURL_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_FEATURES: ${AI_FEATURES:-on}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-1}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      INSTANCE_NAME: ${INSTANCE_NAME:-Izgah}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/gorkemio/izgah}
    volumes:
      - thumbnails_data:/data/thumbnails

volumes:
  pgdata_prod:
  thumbnails_data:
