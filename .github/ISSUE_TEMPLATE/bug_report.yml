name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** report security issues here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Izgah version or commit
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Browser extension
        - Self-hosting / Docker
        - Translations
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and OS
  - type: textarea
    id: logs
    attributes:
      label: Request ID or logs
      description: Error pages and extension errors show a request ID; include it if you have one.
      render: text
