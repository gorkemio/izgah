<!doctype html>
<html
	lang="%izgah.lang%"
	data-tz="%izgah.timeZone%"
	data-source="%izgah.sourceUrl%"
	data-theme="%izgah.theme%"
	data-light-theme="%izgah.lightTheme%"
	data-dark-theme="%izgah.darkTheme%"
	data-effects="%izgah.effects%"
>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="%izgah.colorScheme%" />
		<meta name="application-name" content="%izgah.instanceName%" />
		<meta name="robots" content="noindex, nofollow" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body>
		<noscript><p class="noscript-banner" role="alert">%izgah.noscript%</p></noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
